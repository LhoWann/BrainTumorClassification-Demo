[project]
name = "brain-tumor-mri-classification"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
ignore = ["W292"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]