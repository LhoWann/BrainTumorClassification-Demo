  <rect x="420" y="190" width="312" height="34" rx="9" fill="none" stroke="#33496f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g fill="#ff800e" fill-opacity="0.08" stroke="#ff800e" stroke-opacity="0.55" stroke-width="1.2">
    <rect x="420" y="232" width="312" height="34" rx="9"/><rect x="420" y="274" width="312" height="34" rx="9"/><rect x="420" y="316" width="312" height="34" rx="9"/>
    <rect x="420" y="358" width="312" height="34" rx="9"/><rect x="420" y="400" width="312" height="34" rx="9"/><rect x="420" y="442" width="312" height="34" rx="9"/>
  </g>
  <rect x="420" y="484" width="312" height="34" rx="9" fill="#a2c8ec" fill-opacity="0.10" stroke="#33496f" stroke-width="1.2"/>
