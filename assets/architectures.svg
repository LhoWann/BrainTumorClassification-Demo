    <text x="804" y="505.5" fill="#aebbd0">Output</text>
  </g>
  <g font-size="12" fill="#a2c8ec" text-anchor="end">
    <text x="1088" y="211.5">3×224×224</text><text x="1088" y="253.5">32×112×112</text><text x="1088" y="295.5">320×7×7</text>
    <text x="1088" y="337.5">1280×7×7</text><text x="1088" y="379.5">1280</text><text x="1088" y="421.5">1280</text>
    <text x="1088" y="463.5">4</text><text x="1088" y="505.5">4 logit</text>
  </g>
  <line x1="790" y1="568" x2="1102" y2="568" stroke="#26385a" stroke-width="1.2"/>
  <text x="790" y="590" font-size="12.5" fill="#aebbd0">Transfer learning: classifier diganti,</text>
