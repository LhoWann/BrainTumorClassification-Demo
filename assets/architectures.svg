  <g fill="#ff800e"><circle cx="804" cy="417" r="4"/><circle cx="804" cy="459" r="4"/></g>
  <g font-size="12.5" fill="#f4f7fb">
    <text x="804" y="211.5" fill="#aebbd0">Input</text>
