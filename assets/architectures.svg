  <g fill="#ff800e"><circle cx="434" cy="249" r="4"/><circle cx="434" cy="291" r="4"/><circle cx="434" cy="333" r="4"/><circle cx="434" cy="375" r="4"/><circle cx="434" cy="417" r="4"/><circle cx="434" cy="459" r="4"/></g>
  <circle cx="434" cy="501" r="4" fill="#a2c8ec"/>
  <g font-size="12.5" fill="#f4f7fb">
    <text x="434" y="211.5" fill="#aebbd0">Input</text>
    <text x="446" y="253.5">Conv3×3 · BN · ReLU · MaxPool</text>
    <text x="446" y="295.5">Conv3×3 · BN · ReLU · MaxPool</text>
    <text x="446" y="337.5">Conv3×3 · BN · ReLU · MaxPool</text>
    <text x="446" y="379.5">Blok 4: Conv · BN · ReLU · Pool</text>
    <text x="446" y="421.5">Global Average Pooling</text>
    <text x="446" y="463.5">Dropout (p dari tuning)</text>
    <text x="446" y="505.5">Linear 256 → 4</text>
    <text x="434" y="547.5" fill="#aebbd0">Output</text>
  </g>
  <g font-size="12" fill="#a2c8ec" text-anchor="end">
    <text x="718" y="211.5">3×224×224</text><text x="718" y="253.5">32×112×112</text><text x="718" y="295.5">64×56×56</text>
    <text x="718" y="337.5">128×28×28</text><text x="718" y="379.5">256×14×14</text><text x="718" y="421.5">256</text>
    <text x="718" y="463.5">256</text><text x="718" y="505.5">4</text><text x="718" y="547.5">4 logit</text>
  </g>
  <line x1="420" y1="568" x2="732" y2="568" stroke="#26385a" stroke-width="1.2"/>
  <text x="420" y="590" font-size="12.5" fill="#aebbd0"><tspan fill="#ff800e" font-weight="600">Muon:</tspan> bobot filter 4 layer Conv.</text>
  <text x="420" y="608" font-size="12.5" fill="#aebbd0"><tspan fill="#f4f7fb" font-weight="600">AdamW:</tspan> bias, BatchNorm, Linear output.</text>

  <!-- ===== efficientnet_b0 ===== -->
  <rect x="770" y="100" width="352" height="520" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <text x="790" y="134" font-size="18" font-weight="600" fill="#f4f7fb">efficientnet_b0</text>
  <g font-size="12.5" fill="#f4f7fb">
    <rect x="790" y="148" width="131" height="24" rx="12" fill="#a2c8ec" fill-opacity="0.08" stroke="#33496f" stroke-width="1.2"/><text x="802" y="164.5">4,0 jt parameter</text>
    <rect x="929" y="148" width="64" height="24" rx="12" fill="none" stroke="#33496f" stroke-width="1.2" stroke-dasharray="3 3"/><text x="941" y="164.5" fill="#aebbd0">AdamW</text>
