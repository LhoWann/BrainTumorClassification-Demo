<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="650" viewBox="0 0 1152 650" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>Arsitektur 3 model</title>
  <defs>
    <clipPath id="card"><rect x="1.44" y="1.44" width="1149.12" height="647.12" rx="18.72"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#091122"/><stop offset="0.45" stop-color="#101b33"/>
      <stop offset="1" stop-color="#1b2c51"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#26385a" stop-opacity="0.55"/><stop offset="1" stop-color="#26385a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1152" height="650" fill="url(#bg)"/>
    <rect width="1152" height="650" fill="url(#glow)"/>
  </g>
  <rect x="1.44" y="1.44" width="1149.12" height="647.12" rx="18.72" fill="none" stroke="#26385a" stroke-width="2.88"/>

  <text x="30" y="52" font-size="26" font-weight="600" fill="#f4f7fb">Arsitektur <tspan fill="#a2c8ec">3 Model</tspan></text>
  <text x="30" y="80" font-size="14" fill="#aebbd0">Input 3×224×224, output 4 logit (satu per kelas). Ukuran tensor ditulis C×H×W.</text>
  <g font-size="12.5" fill="#aebbd0">
    <circle cx="706" cy="47" r="5" fill="#a2c8ec"/><text x="717" y="51.5">layer dasar</text>
    <circle cx="812" cy="47" r="5" fill="#ff800e"/><text x="823" y="51.5">baru / diganti</text>
    <circle cx="930" cy="47" r="5" fill="#8d7bc0"/><text x="941" y="51.5">bobot pretrained ImageNet</text>
  </g>

  <!-- ===== cnn_scratch ===== -->
  <rect x="30" y="100" width="352" height="520" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <text x="50" y="134" font-size="18" font-weight="600" fill="#f4f7fb">cnn_scratch</text>
  <g font-size="12.5" fill="#f4f7fb">
    <rect x="50" y="148" width="131" height="24" rx="12" fill="#a2c8ec" fill-opacity="0.08" stroke="#33496f" stroke-width="1.2"/><text x="62" y="164.5">224 rb parameter</text>
    <rect x="189" y="148" width="64" height="24" rx="12" fill="none" stroke="#33496f" stroke-width="1.2" stroke-dasharray="3 3"/><text x="201" y="164.5" fill="#aebbd0">AdamW</text>
  </g>
  <g stroke="#33496f" stroke-width="1.4">
    <line x1="206" y1="224" x2="206" y2="232"/><line x1="206" y1="266" x2="206" y2="274"/><line x1="206" y1="308" x2="206" y2="316"/>
    <line x1="206" y1="350" x2="206" y2="358"/><line x1="206" y1="392" x2="206" y2="400"/><line x1="206" y1="434" x2="206" y2="442"/>
  </g>
  <rect x="50" y="190" width="312" height="34" rx="9" fill="none" stroke="#33496f" stroke-width="1.2" stroke-dasharray="4 3"/>
