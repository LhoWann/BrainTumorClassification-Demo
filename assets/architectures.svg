    <rect x="50" y="232" width="312" height="34" rx="9"/><rect x="50" y="274" width="312" height="34" rx="9"/><rect x="50" y="316" width="312" height="34" rx="9"/>
    <rect x="50" y="358" width="312" height="34" rx="9"/><rect x="50" y="400" width="312" height="34" rx="9"/>
  </g>
  <rect x="50" y="442" width="312" height="34" rx="9" fill="none" stroke="#33496f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g fill="#a2c8ec"><circle cx="64" cy="249" r="4"/><circle cx="64" cy="291" r="4"/><circle cx="64" cy="333" r="4"/><circle cx="64" cy="375" r="4"/><circle cx="64" cy="417" r="4"/></g>
  <g font-size="12.5" fill="#f4f7fb">
    <text x="64" y="211.5" fill="#aebbd0">Input</text>
    <text x="76" y="253.5">Conv3×3 · ReLU · MaxPool</text>
    <text x="76" y="295.5">Conv3×3 · ReLU · MaxPool</text>
    <text x="76" y="337.5">Conv3×3 · ReLU · MaxPool</text>
    <text x="76" y="379.5">Flatten</text>
    <text x="76" y="421.5">Linear 50.176 → 4</text>
    <text x="64" y="463.5" fill="#aebbd0">Output</text>
  </g>
  <g font-size="12" fill="#a2c8ec" text-anchor="end">
    <text x="348" y="211.5">3×224×224</text><text x="348" y="253.5">16×112×112</text><text x="348" y="295.5">32×56×56</text>
    <text x="348" y="337.5">64×28×28</text><text x="348" y="379.5">50.176</text><text x="348" y="421.5">≈200 rb param</text>
    <text x="348" y="463.5">4 logit</text>
  </g>
  <line x1="50" y1="568" x2="362" y2="568" stroke="#26385a" stroke-width="1.2"/>
  <text x="50" y="590" font-size="12.5" fill="#aebbd0">Baseline: tanpa BatchNorm dan dropout.</text>
  <text x="50" y="608" font-size="12.5" fill="#aebbd0">Sekitar 90% parameter ada di layer Linear.</text>

  <!-- ===== cnn_modified ===== -->
  <rect x="400" y="100" width="352" height="520" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <text x="420" y="134" font-size="18" font-weight="600" fill="#f4f7fb">cnn_modified</text>
  <g font-size="12.5" fill="#f4f7fb">
    <rect x="420" y="148" width="131" height="24" rx="12" fill="#a2c8ec" fill-opacity="0.08" stroke="#33496f" stroke-width="1.2"/><text x="432" y="164.5">390 rb parameter</text>
    <rect x="559" y="148" width="116" height="24" rx="12" fill="none" stroke="#ff800e" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="3 3"/><text x="571" y="164.5" fill="#aebbd0">Muon + AdamW</text>
