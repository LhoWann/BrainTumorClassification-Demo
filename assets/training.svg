<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="530" viewBox="0 0 1152 530" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title>Loop training per fold</title>
  <defs>
    <clipPath id="card"><rect x="1.44" y="1.44" width="1149.12" height="527.12" rx="18.72"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#091122"/><stop offset="0.45" stop-color="#101b33"/>
      <stop offset="1" stop-color="#1b2c51"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#26385a" stop-opacity="0.55"/><stop offset="1" stop-color="#26385a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1152" height="530" fill="url(#bg)"/>
    <rect width="1152" height="530" fill="url(#glow)"/>
  </g>
  <rect x="1.44" y="1.44" width="1149.12" height="527.12" rx="18.72" fill="none" stroke="#26385a" stroke-width="2.88"/>

  <text x="30" y="52" font-size="26" font-weight="600" fill="#f4f7fb">Loop <tspan fill="#a2c8ec">Training</tspan> per Fold</text>
  <text x="30" y="80" font-size="14" fill="#aebbd0">train_fold di src/training/trainer.py: maks 40 epoch, berhenti jika val loss tidak membaik selama 6 epoch</text>

  <!-- card 1 -->
  <rect x="30" y="106" width="252" height="196" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <circle cx="62" cy="140" r="14" fill="#a2c8ec"/>
  <text x="62" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#091122">1</text>
  <text x="86" y="146" font-size="16" font-weight="600" fill="#f4f7fb">Persiapan</text>
  <g font-size="13" font-weight="600" fill="#f4f7fb">
    <text x="50" y="180">Loss</text><text x="50" y="222">Optimizer</text><text x="50" y="264">Scheduler</text>
  </g>
  <g font-size="12.5" fill="#aebbd0">
    <text x="50" y="199">CrossEntropy + label smoothing</text>
    <text x="50" y="241">AdamW, atau Muon + AdamW</text>
    <text x="50" y="283">ReduceLROnPlateau per optimizer</text>
  </g>

  <line x1="285" y1="204" x2="299" y2="204" stroke="#ff800e" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/><path d="M 307 204 L 299 199 L 299 209 Z" fill="#ff800e"/>

  <!-- card 2 -->
  <rect x="310" y="106" width="252" height="196" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <circle cx="342" cy="140" r="14" fill="#ff800e"/>
  <text x="342" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#091122">2</text>
  <text x="366" y="146" font-size="16" font-weight="600" fill="#f4f7fb">Train 1 epoch</text>
  <g font-size="12.5" fill="#aebbd0">
    <text x="330" y="180">model.train(), augmentasi aktif</text>
    <text x="330" y="200">batch 16 → forward → loss</text>
    <text x="330" y="220">backward(loss / 2)</text>
  </g>
  <line x1="330" y1="236" x2="542" y2="236" stroke="#26385a" stroke-width="1.2"/>
  <text x="330" y="260" font-size="13" font-weight="600" fill="#f4f7fb">optimizer.step() tiap 2 batch</text>
  <text x="330" y="282" font-size="12.5" fill="#aebbd0">batch efektif 32, fp32 di CUDA</text>

  <line x1="565" y1="204" x2="579" y2="204" stroke="#ff800e" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/><path d="M 587 204 L 579 199 L 579 209 Z" fill="#ff800e"/>

  <!-- card 3 -->
  <rect x="590" y="106" width="252" height="196" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <circle cx="622" cy="140" r="14" fill="#8d7bc0"/>
  <text x="622" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#091122">3</text>
  <text x="646" y="146" font-size="16" font-weight="600" fill="#f4f7fb">Valid</text>
  <g font-size="12.5" fill="#aebbd0">
    <text x="610" y="180">model.eval(), tanpa gradien</text>
    <text x="610" y="200">tanpa augmentasi, bobot tetap</text>
    <text x="610" y="220">hitung val loss dan val acc</text>
  </g>
  <line x1="610" y1="236" x2="822" y2="236" stroke="#26385a" stroke-width="1.2"/>
  <text x="610" y="260" font-size="13" font-weight="600" fill="#f4f7fb">scheduler.step(val loss)</text>
  <text x="610" y="282" font-size="12.5" fill="#aebbd0">lr × 0.5 jika stagnan 2 epoch</text>

  <line x1="845" y1="204" x2="859" y2="204" stroke="#ff800e" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/><path d="M 867 204 L 859 199 L 859 209 Z" fill="#ff800e"/>

  <!-- card 4 -->
  <rect x="870" y="106" width="252" height="196" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <circle cx="902" cy="140" r="14" fill="#e9a3ab"/>
  <text x="902" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#091122">4</text>
  <text x="926" y="146" font-size="16" font-weight="600" fill="#f4f7fb">Early stopping</text>
  <g font-size="12.5" fill="#aebbd0">
    <text x="890" y="180">val loss &lt; best_loss ?</text>
    <text x="890" y="200"><tspan fill="#f4f7fb">ya:</tspan> simpan best_state, wait = 0</text>
    <text x="890" y="220"><tspan fill="#f4f7fb">tidak:</tspan> wait + 1</text>
  </g>
  <line x1="890" y1="236" x2="1102" y2="236" stroke="#26385a" stroke-width="1.2"/>
  <text x="890" y="260" font-size="13" font-weight="600" fill="#f4f7fb">Berhenti jika wait = 6</text>
  <text x="890" y="282" font-size="12.5" fill="#aebbd0">atau epoch 40 tercapai</text>

  <!-- loop back -->
  <path d="M 996 304 L 996 322 L 436 322 L 436 314" fill="none" stroke="#ff800e" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 436 305 L 431 314 L 441 314 Z" fill="#ff800e"/>
  <rect x="594" y="310" width="244" height="24" rx="12" fill="#101b33" stroke="#33496f" stroke-width="1.2"/>
  <text x="716" y="326.5" text-anchor="middle" font-size="12.5" fill="#aebbd0">belum berhenti → epoch berikutnya</text>

  <!-- chart card -->
  <rect x="30" y="350" width="650" height="160" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <text x="50" y="378" font-size="13.5" font-weight="600" fill="#f4f7fb">Ilustrasi early stopping</text>
  <line x1="440" y1="373" x2="462" y2="373" stroke="#a2c8ec" stroke-width="2.4" stroke-linecap="round"/>
  <text x="468" y="377.5" font-size="12" fill="#aebbd0">train loss</text>
  <line x1="548" y1="373" x2="570" y2="373" stroke="#e9a3ab" stroke-width="2.4" stroke-linecap="round"/>
  <text x="576" y="377.5" font-size="12" fill="#aebbd0">val loss</text>
  <rect x="407" y="392" width="190" height="96" fill="#ff800e" fill-opacity="0.07"/>
  <line x1="60" y1="488" x2="660" y2="488" stroke="#33496f" stroke-width="1.4"/>
  <line x1="407" y1="392" x2="407" y2="488" stroke="#ff800e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="597" y1="392" x2="597" y2="488" stroke="#e9a3ab" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M 60 400 C 160 448, 320 470, 597 478" fill="none" stroke="#a2c8ec" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 60 396 C 150 440, 330 456, 407 456 C 480 456, 540 448, 597 438" fill="none" stroke="#e9a3ab" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="407" cy="456" r="5" fill="#ff800e" stroke="#0c1628" stroke-width="1.5"/>
  <text x="399" y="410" text-anchor="end" font-size="12" fill="#f4f7fb">epoch terbaik: val loss terendah</text>
  <text x="502" y="410" text-anchor="middle" font-size="12" fill="#ff800e">patience 6 epoch</text>
  <text x="603" y="410" font-size="12" fill="#e9a3ab">berhenti</text>
  <text x="660" y="503" text-anchor="end" font-size="11.5" fill="#aebbd0">epoch →</text>

  <!-- end card -->
  <rect x="708" y="350" width="414" height="160" rx="14" fill="#0c1628" stroke="#33496f" stroke-width="1.4"/>
  <text x="728" y="378" font-size="13.5" font-weight="600" fill="#f4f7fb">Setelah loop selesai</text>
  <g font-size="11" font-weight="700" fill="#091122" text-anchor="middle">
    <circle cx="738" cy="403" r="9" fill="#a2c8ec"/><text x="738" y="407">1</text>
    <circle cx="738" cy="431" r="9" fill="#a2c8ec"/><text x="738" y="435">2</text>
    <circle cx="738" cy="459" r="9" fill="#a2c8ec"/><text x="738" y="463">3</text>
    <circle cx="738" cy="487" r="9" fill="#a2c8ec"/><text x="738" y="491">4</text>
  </g>
  <g font-size="12.5" fill="#aebbd0">
    <text x="756" y="407.5">Muat best_state (val loss terendah)</text>
    <text x="756" y="435.5">Simpan ke <tspan fill="#a2c8ec">outputs/models/&lt;model&gt;/fold&lt;k&gt;.pt</tspan></text>
    <text x="756" y="463.5">Prediksi 1.584 gambar Testing</text>
    <text x="756" y="491.5">Metrik + grafik history, confusion matrix, ROC</text>
  </g>
</svg>